- name: Common tool setup on all the servers
  hosts: appsrvgrp
  become: yes
  vars:
    tom_url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.37/bin/apache-tomcat-8.5.37.tar.gz

  tasks:
    - name: Install JDK on CentOS 6, 7, and 8
      yum:
        name: java-1.8.0-openjdk.x86_64
        state: present
      when: ansible_distribution == 'CentOS' and ansible_distribution_major_version | int <= 8

    - name: Install JDK on Ubuntu 14, 16, 18, 20, and 22
      apt:
        name: openjdk-8-jdk
        state: present
        update_cache: yes
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 14

    - name: Download Tomcat Tar Ball/Binaries
      get_url:
        url: "{{ tom_url }}"
        dest: /tmp/tomcat-8.tar.gz

    - name: Add tomcat group
      group:
        name: tomcat
        state: present

    - name: Add tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/nologin
        home: /usr/local/tomcat8

    - name: Create tomcat directory
      file:
        path: /usr/local/tomcat8
        state: directory
        owner: tomcat
        group: tomcat

    - name: Extract tomcat
      unarchive:
        src: /tmp/tomcat-8.tar.gz
        dest: /usr/local/tomcat8/
        remote_src: yes
        list_files: yes
      register: unarchive_info

    - name: Synchronize /tmp/tomcat8/tomcat_cont with /usr/local/tomcat8.
      synchronize:
        src: "/tmp/tomcat8/{{ unarchive_info.files[0].split('/')[0] }}/"
        dest: /usr/local/tomcat8/
        delegate_to: "{{ inventory_hostname }}"

    - name: Change ownership of /usr/local/tomcat8
      file:
        path: /usr/local/tomcat8
        owner: tomcat
        group: tomcat
        recurse: yes

    - name: Setup tomcat SVC file on Ubuntu 14, 16, 18, 20, and 22
      template:
         src: templates/ubuntu-svcfile.j2
         dest: /etc/init.d/tomcat
         mode: "a+x"
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int >= 14

    - name: Setup tomcat SVC file on CentOS 7, 8 and Rocky Linux 8, 9
      template:
         src: templates/el8-svcfile.j2
         dest: /etc/systemd/system/tomcat.service
         mode: "a+x"
      when: ansible_distribution == 'CentOS' and ansible_distribution_major_version | int >= 7
      when: ansible_distribution == 'RedHat' and ansible_distribution_major_version | int >= 8
      when: ansible_distribution